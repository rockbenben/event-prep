<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="badge-grad" x1="4" y1="4" x2="28" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="13" y="13" width="16" height="16" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Lanyard clip -->
  <rect x="12" y="1.5" width="8" height="4" rx="1.5" fill="#94a3b8"/>
  <!-- Badge card -->
  <rect x="4" y="4.5" width="24" height="25" rx="5" fill="url(#badge-grad)"/>
  <!-- Lanyard hole slot -->
  <rect x="11.5" y="7" width="9" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Agenda lines -->
  <rect x="8" y="13.5" width="7.5" height="2" rx="1" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="8" y="17.5" width="5.5" height="2" rx="1" fill="#ffffff" fill-opacity="0.65"/>
  <rect x="8" y="21.5" width="6.5" height="2" rx="1" fill="#ffffff" fill-opacity="0.65"/>
  <!-- Ready tick badge -->
  <g filter="url(#shadow)">
    <circle cx="21.5" cy="20.5" r="5.5" fill="#16a34a"/>
    <path d="M19.2 20.5l1.6 1.6 3-3.2" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
